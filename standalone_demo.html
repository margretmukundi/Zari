      const [activeReceipt, setActiveReceipt] = useState(null);

        let val = translations[lang][key] || translations['en'][key] || key;
        if (typeof val === 'string' && params) {
          Object.keys(params).forEach(k => { val = val.replace(`{${k}}`, params[k]); });
        }
        return val;
      };

      const addToCart = (product) => {
        setCart(prev => {
          const idx = prev.findIndex(item => item.id === product.id);
          if (idx > -1) {
            const updated = [...prev];
            updated[idx].quantity += 1;
            return updated;
          }
          return [...prev, { ...product, quantity: 1 }];
        });
      };

      const cartSubtotal = cart.reduce((sum, i) => sum + i.price * i.quantity, 0);
      const grandTotal = Math.round(cartSubtotal * 1.16);

        if (activeTypeFilter !== 'all' && item.type !== activeTypeFilter) return false;
        if (selectedCategory !== 'all' && item.category !== selectedCategory) return false;

          const q = searchQuery.toLowerCase().trim();
          const nameEn = (item.name.en || '').toLowerCase();
          const nameSw = (item.name.sw || '').toLowerCase();
          const descEn = (item.description.en || '').toLowerCase();
          const descSw = (item.description.sw || '').toLowerCase();
          const category = (item.category || '').toLowerCase();
          const specs = (item.specs || []).join(' ').toLowerCase();

          return (
            nameEn.includes(q) ||
            nameSw.includes(q) ||
            descEn.includes(q) ||
            descSw.includes(q) ||
            category.includes(q) ||
            specs.includes(q)
          );
        }
        return true;
      });

          {/* Cart Drawer */}
          {isCartOpen && (
            <div className="fixed inset-0 bg-black/60 z-50 flex justify-end">
              <div className="w-full max-w-md bg-white h-full p-5 flex flex-col justify-between shadow-2xl">
                <div>
                  <div className="flex justify-between items-center border-b pb-3">
                    <h3 className="font-black text-base">{t('cartTitle')}</h3>
                    <button onClick={() => setIsCartOpen(false)} className="font-bold text-gray-400 hover:text-gray-900">✕</button>
                  </div>
                  <div className="space-y-3 mt-4">
                    {cart.map(item => (
                      <div key={item.id} className="flex justify-between text-xs border-b pb-2">
                        <div>
                          <p className="font-bold">{item.name[lang]}</p>
                          <p className="text-gray-500">Qty: {item.quantity}</p>
                        </div>
                        <span className="font-bold text-rose-600">KSh {(item.price * item.quantity).toLocaleString()}</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="border-t pt-4 space-y-3">
                  <div className="flex justify-between text-sm font-black">
                    <span>{t('totalAmount')}</span>
                    <span className="text-rose-600 text-lg">KSh {grandTotal.toLocaleString()}</span>
                  </div>
                  <button
                    onClick={() => { setIsCartOpen(false); setIsCheckoutOpen(true); }}
                    className="w-full py-3 bg-rose-600 text-white font-bold rounded-xl text-xs shadow-md shadow-rose-600/20"
                  >
                    {t('checkoutBtn')}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Checkout Modal */}
          {isCheckoutOpen && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white p-6 rounded-3xl max-w-md w-full space-y-4 shadow-2xl">
                <div className="flex justify-between border-b pb-3">
                  <h3 className="font-black text-base">{t('checkoutHeader')}</h3>
                  <button onClick={() => setIsCheckoutOpen(false)}>✕</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-gray-700 block mb-1">{t('phoneNumber')}</label>
                    <input type="text" defaultValue="0791781961" id="checkoutPhoneInput" className="w-full p-2.5 bg-rose-50/50 border border-rose-200 rounded-xl font-bold text-sm" />
                  </div>
                  <div>
                    <label className="font-bold text-gray-700 block mb-1">{t('notes')}</label>
                    <input type="text" placeholder="e.g. Size 38 shoes, 22-inch wig length, Uganda Road Eldoret" className="w-full p-2.5 bg-gray-50 border rounded-xl" />
                  </div>
                </div>

                <button
                  onClick={() => {
                    const phone = document.getElementById('checkoutPhoneInput').value || '0791781961';
                    setIsCheckoutOpen(false);
                    setActiveOrder({ totalAmount: grandTotal, customerPhone: phone });
                    setIsLivePushStatusOpen(true);
                  }}
                  className="w-full py-3.5 bg-mpesa-green text-white font-bold rounded-2xl text-xs shadow-md"
                >
                  Pay KSh {grandTotal.toLocaleString()} via M-PESA STK Push
                </button>
              </div>
            </div>
          )}

          {/* Live Handset Status Overlay */}
          {isLivePushStatusOpen && (
            <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
              <div className="bg-white p-6 rounded-3xl max-w-sm w-full text-center space-y-4 shadow-2xl border border-emerald-200">
                <div className="w-12 h-12 bg-mpesa-green text-white rounded-2xl flex items-center justify-center mx-auto text-xl font-bold shadow-md">📱</div>
                <h3 className="font-black text-base">M-PESA STK Push Sent!</h3>
                <div className="bg-emerald-50 p-3.5 rounded-2xl text-xs text-left space-y-1.5 border border-emerald-200">
                  <p><span className="text-gray-500">Destination Phone:</span> <b className="text-mpesa-green font-mono text-sm">{activeOrder?.customerPhone}</b></p>
                  <p><span className="text-gray-500">Amount:</span> <b>KSh {activeOrder?.totalAmount?.toLocaleString()}</b></p>
                  <p className="text-[11px] text-emerald-900 pt-1 border-t border-emerald-200">
                    A Safaricom M-PESA STK prompt has been dispatched to <b>{activeOrder?.customerPhone}</b>. Please check your phone screen right now and enter your M-PESA PIN to complete payment to ZariBoutique.
                  </p>
                </div>

                <button
                  onClick={() => {
                    const code = 'RJK' + Math.random().toString(36).substring(2, 8).toUpperCase();
                    setActiveReceipt({ code, amount: activeOrder?.totalAmount, date: new Date().toLocaleString() });
                    setIsLivePushStatusOpen(false);
                    setIsReceiptOpen(true);
                    setCart([]);
                  }}
                  className="w-full py-3 bg-mpesa-green text-white font-bold rounded-xl text-xs shadow-md"
                >
                  I Have Entered PIN on Phone (View Digital Receipt)
                </button>
              </div>
            </div>
          )}

          {/* Digital Receipt Modal */}
          {isReceiptOpen && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white p-6 rounded-3xl max-w-sm w-full text-center space-y-3 shadow-2xl">
                <div className="w-12 h-12 bg-emerald-100 text-mpesa-green rounded-full flex items-center justify-center mx-auto text-xl font-bold">✓</div>
                <h3 className="font-black text-lg">{t('stkSuccessTitle')}</h3>
                <div className="bg-rose-50/50 p-3.5 rounded-2xl text-xs font-mono text-left space-y-1.5 border border-rose-100">
                  <p><span className="text-gray-500">M-PESA Code:</span> <b className="text-rose-600">{activeReceipt?.code}</b></p>
                  <p><span className="text-gray-500">Amount:</span> <b>KSh {activeReceipt?.amount?.toLocaleString()}</b></p>
                  <p><span className="text-gray-500">Date:</span> {activeReceipt?.date}</p>
                </div>
                <button
                  onClick={() => setIsReceiptOpen(false)}
                  className="w-full py-2.5 bg-gray-900 text-white font-bold rounded-xl text-xs"
                >
                  {t('closeBtn')}
                </button>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-slate-950 text-gray-400 text-xs py-8 mt-12 text-center border-t border-rose-950">
            <p>© 2026 ZariBoutique Eldoret • Safaricom Daraja API Gateway</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ZariBoutiqueApp />);
  </script>
</body>
</html>
